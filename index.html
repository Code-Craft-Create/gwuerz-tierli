<!doctype html>
<html lang="gsw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gwürz Tierli</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐌</text></svg>">
  <style>
    :root {
      --bg: #fbf3e8;
      --card: #fffaf3;
      --text: #4a2f1d;
      --muted: #8a6a52;
      --accent: #c2662d;
      --accent-dark: #9c4e1f;
      --shadow: 0 10px 30px rgba(120, 70, 30, 0.15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #241912;
        --card: #33241a;
        --text: #f6e7d6;
        --muted: #c9a98c;
        --accent: #e08a4f;
        --accent-dark: #c2662d;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 4px; }
    .untertitel { color: var(--muted); margin: 0 0 32px; font-style: italic; }
    .charte {
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 40px 24px;
      width: 100%;
      max-width: 560px;
    }
    #name {
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: bold;
      margin: 0 0 32px;
      min-height: 1.3em;
    }
    /* Gwürz und Tierli bliibed zäme; bricht nume nachem Strich um */
    #name span { display: inline-block; overflow-wrap: anywhere; }
    #name.neu { animation: hopse 0.4s ease-out; }
    @keyframes hopse {
      0% { transform: scale(0.8); opacity: 0; }
      70% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }
    button {
      font: inherit;
      font-size: 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 32px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--accent-dark);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    /* Bildli vom Gwürz und vom Tierli (nume wenn s Häkli gsetzt isch) */
    #bildli {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: -8px 0 16px;
    }
    #bildli[hidden] { display: none; }
    #bildli .rahme {
      width: clamp(96px, 30vw, 132px);
      aspect-ratio: 1;
      padding: 12px;
      border-radius: 50%;
      background: #fff1dd;
      box-shadow: inset 0 0 0 3px rgba(194, 102, 45, 0.15);
    }
    #bildli svg { display: block; width: 100%; height: 100%; overflow: visible; }
    #bildli .plus { font-size: 1.6rem; color: var(--muted); }
    #bildli.neu .rahme { animation: hopse 0.4s ease-out; }
    #bildli.neu .rahme + .plus + .rahme { animation-delay: 0.08s; animation-fill-mode: backwards; }
    .schalter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
    }
    .schalter input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
    .version { margin-top: 12px; color: var(--muted); font-size: 0.7rem; opacity: 0.6; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>Gwürz Tierli</h1>
  <p class="untertitel">Dä süessi Kosename-Generator</p>

  <main class="charte">
    <div id="bildli" hidden>
      <div class="rahme" id="gwuerzBild"></div>
      <span class="plus" aria-hidden="true">+</span>
      <div class="rahme" id="tierliBild"></div>
    </div>
    <p id="name" aria-live="polite">&nbsp;</p>
    <button id="generiere" type="button">Nomal eis! ✨</button>
    <div>
      <label class="schalter"><input type="checkbox" id="bildliZeige" autocomplete="off"> Bildli zeige</label>
    </div>
  </main>

  <footer>Zimt, Honig &amp; es Tierli – fertig isch dä Kosename.</footer>
  <!-- Bi jedem Release ufezelle -->
  <div class="version">v0.5.0</div>

  <script src="woerter.js"></script>
  <script src="bilder.js"></script>
  <script>
    const nameEl = document.getElementById("name");
    const bildliEl = document.getElementById("bildli");
    const gwürzBildEl = document.getElementById("gwuerzBild");
    const tierliBildEl = document.getElementById("tierliBild");
    const bildliZeige = document.getElementById("bildliZeige");
    // Gwürz und Tierli vo de letschte zwei Näme chömed nöd grad wieder
    const SPERRI = 2;
    const letschtiGwürz = [];
    const letschtiTierli = [];

    function zuefällig(lischte, letschti) {
      const frei = lischte.filter((w) => !letschti.includes(w));
      const wort = frei[Math.floor(Math.random() * frei.length)];
      letschti.push(wort);
      if (letschti.length > SPERRI) letschti.shift();
      return wort;
    }

    function generiere() {
      const g = zuefällig(GWUERZ, letschtiGwürz);
      const t = zuefällig(TIERLI, letschtiTierli);

      const gwürzEl = document.createElement("span");
      const tierliEl = document.createElement("span");
      gwürzEl.textContent = g + "-";
      tierliEl.textContent = t;
      nameEl.replaceChildren(gwürzEl, tierliEl);
      gwürzBildEl.innerHTML = bild(g);
      tierliBildEl.innerHTML = bild(t);
      for (const el of [nameEl, bildliEl]) {
        el.classList.remove("neu");
        void el.offsetWidth;
        el.classList.add("neu");
      }
    }

    bildliZeige.addEventListener("change", () => {
      bildliEl.hidden = !bildliZeige.checked;
    });

    const knopf = document.getElementById("generiere");
    knopf.addEventListener("click", generiere);
    // Läertaste macht au en neue Name (de Knopf sälber reagiert scho druf)
    document.addEventListener("keydown", (e) => {
      if (e.code !== "Space" || e.repeat || e.target === knopf || e.target === bildliZeige) return;
      e.preventDefault();
      generiere();
    });
    generiere();
  </script>
</body>
</html>
